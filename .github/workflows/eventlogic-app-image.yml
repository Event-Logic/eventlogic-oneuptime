name: Event Logic app image (365-day history)

# Builds the OneUptime `app` image from this branch (upstream 14.0.100 plus the
# Event Logic 365-day-history changes) and pushes it to GHCR as
#   ghcr.io/event-logic/oneuptime-app:<tag>
# Upstream's Scripts/GHA/build_docker_images.sh hard-codes the oneuptime/ and
# ghcr.io/oneuptime/ names, so this workflow drives docker buildx directly.
# Deploy by setting image.overrides.app to the pushed reference in the Helm
# values (see DevOps/oneuptime-iac/k8s/values-14.0.100.yaml).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (default: <upstream version>-365)"
        required: false
        default: ""
  push:
    branches:
      - "eventlogic/365-day-history-14.0.100"

permissions:
  contents: read
  packages: write

jobs:
  # The suites that cover the Event Logic changes (the uptime strip and its
  # helpers, the status page display settings) run before any image is built:
  # a red test means no image. The App's own `npm run compile` runs inside the
  # Docker build, so the type-check is covered there.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install Common
        working-directory: packages/Common
        run: npm ci --no-audit --no-fund

      - name: Write the test config.env (as packages/Common/test-setup.sh does, without starting Postgres/Valkey; these suites use neither)
        run: |
          sed -n '/^cat <<EOL > config.env/,/^EOL/p' packages/Common/test-setup.sh | sed '1d;$d' | grep -v BILLING_PRIVATE_KEY > config.env
          node ./Scripts/Install/MergeEnvTemplate.js

      - name: Test the uptime strip, its helpers and the status page display settings
        working-directory: packages/Common
        run: |
          export $(grep -v '^#' ../../config.env | xargs)
          node --max-old-space-size=4096 node_modules/.bin/jest \
            Tests/UI/Components/Graphs Tests/Utils/Uptime Tests/App/Dashboard/StatusPageDisplaySettingsCard \
            --forceExit --maxWorkers=2

  app-image:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{ github.run_number }} # tells prerun's configure.sh it is in CI (no git pull)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # `npm run prerun` (Scripts/Install/configure.sh) installs gomplate itself when
      # it is missing and renders every Dockerfile.tpl, so no local action is needed
      # and the job works from any ref.
      - name: Generate Dockerfiles from Dockerfile.tpl
        run: npm run prerun

      - name: Resolve version and tag
        id: meta
        run: |
          VERSION="$(tr -d ' \n' < VERSION)"
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${VERSION}-365"; fi
          SHA_TAG="${TAG}-$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "Building app ${VERSION} as ghcr.io/event-logic/oneuptime-app:${TAG} (also :${SHA_TAG})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/App/Dockerfile
          # "community" is the final stage (CMD, USER node, edition env); community-build
          # is the intermediate build stage and has no start command.
          target: community
          platforms: linux/amd64
          push: true
          # The plain tag floats with the branch; the -<sha> tag is unique per build,
          # so pointing image.overrides.app at it always rolls the Deployment.
          tags: |
            ghcr.io/event-logic/oneuptime-app:${{ steps.meta.outputs.tag }}
            ghcr.io/event-logic/oneuptime-app:${{ steps.meta.outputs.sha_tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
