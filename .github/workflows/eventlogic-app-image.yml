name: Event Logic app image (365-day history)

# Builds the OneUptime `app` image from this branch (upstream 14.0.100 plus the
# Event Logic 365-day-history changes) and pushes it to GHCR as
#   ghcr.io/event-logic/oneuptime-app:<tag>
# Upstream's Scripts/GHA/build_docker_images.sh hard-codes the oneuptime/ and
# ghcr.io/oneuptime/ names, so this workflow drives docker buildx directly.
# Deploy by setting image.overrides.app to the pushed reference in the Helm
# values (see DevOps/oneuptime-iac/k8s/values-14.0.100.yaml).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (default: <upstream version>-365)"
        required: false
        default: ""
  push:
    branches:
      - "eventlogic/365-day-history-14.0.100"

permissions:
  contents: read
  packages: write

jobs:
  app-image:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{ github.run_number }} # tells prerun's configure.sh it is in CI (no git pull)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Generate Dockerfiles from Dockerfile.tpl
        run: npm run prerun

      - name: Resolve version and tag
        id: meta
        run: |
          VERSION="$(tr -d ' \n' < VERSION)"
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${VERSION}-365"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building app ${VERSION} as ghcr.io/event-logic/oneuptime-app:${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/App/Dockerfile
          target: community-build
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/event-logic/oneuptime-app:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
